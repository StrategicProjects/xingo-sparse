# xingo-sparse (PLAN.md trilha L1, D-0080): publishable on its own, with
# its own version (D12); it depends on no other crate of the workspace
# (xingo-core depends on it, D9).
[package]
name = "xingo-sparse"
version = "0.1.0-dev"
description = "Sparse linear algebra for optimization: generic CSC/CSR containers, threshold-pivoting LU with Forrest-Tomlin basis updates and hypersparse solves, fill-reducing orderings, scaling, and regularized KKT solvers for interior-point methods"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/xingo-sparse"
keywords = ["sparse", "linear-algebra", "lu", "simplex", "factorization"]
categories = ["mathematics", "science", "algorithms"]
# The package is the source, its tests, examples, README and CHANGELOG.
# The proptest regression seeds are development state (replayed by
# `cargo test` from a checkout, meaningless to a user of the crate).
exclude = ["proptest-regressions/"]

# docs.rs builds with `faer` so that `FaerLdl` and `FaerDense` appear.
[package.metadata.docs.rs]
all-features = true

[features]
# faer (pure Rust, MIT) backs the KKT solver `FaerLdl` and the dense kernels
# `FaerDense` (contract Q4: on by default). Without it the crate builds with
# `NaiveDense` only; the simplex side never uses faer (D10).
default = ["faer"]
faer = ["dep:faer"]

[dependencies]
# 0.24.4: the latest stable release (2026-06-24), MSRV 1.84 <= ours (1.90).
# No `rayon` (the factorizations run sequentially, `Par::Seq`: determinism),
# no `rand`/`npy`.
faer = { version = "0.24.4", optional = true, default-features = false, features = ["std", "sparse-linalg"] }

[dev-dependencies]
proptest.workspace = true

# The examples (task L1.7a) build matrices in code with `Triplets`, run
# with `cargo run -p xingo-sparse --example <name>` and end in an `assert!`.
[[example]]
name = "basis_lu"

[[example]]
name = "ordering"

[[example]]
name = "kkt_ipm_step"
required-features = ["faer"]

[lints]
workspace = true

# xingo-sparse (PLAN.md trilha L1, D-0080): publishable on its own, with
# its own version (D12); it depends on no other crate of the workspace
# (xingo-core depends on it, D9). Nothing is inherited from the workspace
# (`*.workspace = true`), so that this directory also builds alone: it is
# mirrored, by `git subtree split`, to the stand-alone repository below
# (L1.7, D-0097), which Zenodo archives for the DOI. The values must stay
# equal to the workspace's.
[package]
name = "xingo-sparse"
version = "0.2.0"
description = "Sparse linear algebra for optimization: generic CSC/CSR containers, threshold-pivoting LU with Forrest-Tomlin basis updates and hypersparse solves, fill-reducing orderings, scaling, and regularized KKT solvers for interior-point methods"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/StrategicProjects/xingo-sparse"
readme = "README.md"
documentation = "https://docs.rs/xingo-sparse"
keywords = ["sparse", "linear-algebra", "lu", "simplex", "factorization"]
categories = ["mathematics", "science", "algorithms"]
# The package is the source, its tests, examples, README, CHANGELOG and
# licenses. The proptest regression seeds are development state (replayed
# by `cargo test` from a checkout, meaningless to a user of the crate); the
# workflows are the mirror's CI and Pages; site/ is the mirror's landing page.
exclude = ["proptest-regressions/", ".github/", "site/"]

# docs.rs builds with `faer` so that `FaerLdl` and `FaerDense` appear.
[package.metadata.docs.rs]
all-features = true

[features]
# faer (pure Rust, MIT) backs the KKT solver `FaerLdl` and the dense kernels
# `FaerDense` (contract Q4: on by default). Without it the crate builds with
# `NaiveDense` only; the simplex side never uses faer (D10).
default = ["faer"]
faer = ["dep:faer"]

[dependencies]
# 0.24.4: the latest stable release (2026-06-24), MSRV 1.84 <= ours (1.90).
# No `rayon` (the factorizations run sequentially, `Par::Seq`: determinism),
# no `rand`/`npy`.
faer = { version = "0.24.4", optional = true, default-features = false, features = ["std", "sparse-linalg"] }

[dev-dependencies]
proptest = "1.6"

# The examples (task L1.7a) build matrices in code with `Triplets`, run
# with `cargo run -p xingo-sparse --example <name>` and end in an `assert!`.
[[example]]
name = "basis_lu"

[[example]]
name = "ordering"

# `kkt_ipm_step` runs the own `SupernodalLdl` always and, with `faer`, the
# `FaerLdl` backend on the same systems.
[[example]]
name = "kkt_ipm_step"

# The workspace's lints, spelled out (see the header comment).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Mathematical notation is kept (PLAN.md §2.3): allowed per module when declared.
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

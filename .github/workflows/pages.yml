name: pages

# Publishes the static landing page in site/ and the API reference (rustdoc,
# with the `faer` feature so that FaerLdl and FaerDense appear) under /api to
# GitHub Pages on every push to main of the stand-alone mirror. Pages must be
# set to "GitHub Actions" as its source (Settings → Pages). Excluded from the
# published package together with site/.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "Cargo.toml"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: the build job, which runs the third-party actions and the
# crate's own build scripts, can only read; the deploy job alone may write to
# Pages. Third-party actions are pinned to a commit (the tag is in the comment).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: API reference
        run: |
          cargo doc --no-deps --all-features
          rm -rf site/api
          cp -R target/doc site/api
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
